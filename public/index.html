<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agmux</title>
    <link rel="stylesheet" href="/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-row">
            <div class="title">agmux</div>
          </div>
        </div>

        <div class="section">
          <ul id="pty-list" class="pty-list"></ul>
        </div>

        <div class="controls">
          <button id="btn-keys" type="button" title="Keybindings">?</button>
          <button id="btn-settings" type="button" title="Settings" aria-label="Settings">&#9881;</button>
          <button id="btn-new" type="button" title="New session (launch agent)">New</button>
          <button id="btn-sidebar-toggle" type="button" class="sidebar-toggle" title="Collapse sidebar">&laquo;</button>
        </div>

      </aside>

      <div
        id="sidebar-resizer"
        class="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>

      <main class="main">
        <section class="terminal-wrap">
          <div id="session-context-bar" class="session-context-bar hidden">
            <button
              id="btn-branch-review"
              type="button"
              class="input-context-action session-context-action"
              title="Open worktree in Emacs branch-review"
              aria-label="Open worktree in Emacs branch-review"
            >
              Review
            </button>
            <button
              id="btn-magit"
              type="button"
              class="input-context-action session-context-action"
              title="Open worktree in Emacs Magit"
              aria-label="Open worktree in Emacs Magit"
            >
              Magit
            </button>
            <div id="input-context" class="input-context">
              <div
                id="input-context-toggle"
                class="input-context-row"
                role="button"
                tabindex="0"
                aria-expanded="false"
                aria-controls="input-history-list"
              >
                <span class="input-context-label">Last input</span>
                <code id="input-context-last" class="input-context-last">(none yet)</code>
                <span id="input-history-label" class="input-history-label">History (0)</span>
              </div>
              <ol id="input-history-list" class="input-history-list hidden"></ol>
            </div>
          </div>
          <div id="pr-context" class="pr-context hidden"></div>
          <div id="terminal" class="terminal"></div>
          <button id="btn-follow" type="button" title="Scroll terminal to newest output">Follow &#8595;</button>
          <button id="btn-kick-others" type="button" title="Disconnect other viewers (fixes narrow terminal from mobile)" class="hidden"></button>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
